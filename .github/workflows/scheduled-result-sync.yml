name: Scheduled match result sync

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scheduled-result-sync.yml"
      - "app.py"
      - "result_sync.py"
      - "football_provider.py"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-match-result-sync
  cancel-in-progress: false

jobs:
  sync-results:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate sync configuration
        env:
          SYNC_TOKEN: ${{ secrets.RESULT_SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::GitHub Actions secret RESULT_SYNC_TOKEN is not configured."
            exit 1
          fi
      - name: Allow Render auto-deploy to finish after a push
        if: github.event_name == 'push'
        run: sleep 75
      - name: Refresh yesterday's results and today's fixtures
        env:
          SYNC_TOKEN: ${{ secrets.RESULT_SYNC_TOKEN }}
        run: |
          TODAY="$(TZ=Europe/Istanbul date +%F)"
          YESTERDAY="$(TZ=Europe/Istanbul date -d '1 day ago' +%F)"

          for DAY in "$YESTERDAY" "$TODAY"; do
            echo "Refreshing fixtures and results for $DAY"
            curl --fail-with-body --silent --show-error \
              --retry 0 --max-time 90 \
              -X POST "https://src-match-analyst.onrender.com/sync/results/refresh?date=$DAY" \
              -H "Authorization: Bearer $SYNC_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{}'
            echo
          done
      - name: Generate today's missing predictions in bounded batches
        env:
          SYNC_TOKEN: ${{ secrets.RESULT_SYNC_TOKEN }}
        run: |
          TODAY="$(TZ=Europe/Istanbul date +%F)"
          for BATCH in $(seq 1 30); do
            RESPONSE="$(curl --fail-with-body --silent --show-error \
              --retry 0 --max-time 90 \
              -X POST "https://src-match-analyst.onrender.com/sync/predictions/refresh?date=$TODAY&limit=8" \
              -H "Authorization: Bearer $SYNC_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{}')"
            echo "$RESPONSE"
            REMAINING="$(printf '%s' "$RESPONSE" | jq -r '.remaining // 0')"
            if [ "$REMAINING" -eq 0 ]; then
              break
            fi
          done
