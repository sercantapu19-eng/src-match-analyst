name: Validate SRC Match Analyst
on:
  pull_request:
  push:
    branches:
      - main
      - feature/global-history-sync
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -c "import app; print('Flask app import OK')"
