services:
  - type: web
    name: src-match-analyst
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --worker-class gthread --workers 1 --threads 4 --timeout 120 --graceful-timeout 30
    plan: free
    disk:
      name: src-match-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/src_match_analyst.db
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
